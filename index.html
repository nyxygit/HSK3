<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>HSK 3.0 · Vocabulary map</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">HSK<em>3.0</em></span>
    <span class="sub">11,000 words · 汉语水平考试</span>
  </div>

  <div class="toggles">
    <label class="sw" title="Show or hide pinyin">
      <input type="checkbox" id="sw-pinyin" checked>
      <span class="track"><span class="knob"></span></span>
      <span class="lbl">Pinyin</span>
    </label>
    <label class="sw" title="Click a card to mark it instead of opening it">
      <input type="checkbox" id="sw-quick">
      <span class="track"><span class="knob"></span></span>
      <span class="lbl">Quick mark</span>
    </label>
  </div>

  <div class="now" id="now"><span class="dot"></span><span id="now-text">Whole map</span></div>

  <div class="search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3a6 6 0 1 0 3.7 10.7l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 9 3Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
    <input id="search" type="search" placeholder="Search hanzi or pinyin…" autocomplete="off" spellcheck="false">
    <span id="search-count"></span>
  </div>

  <div class="progress">
    <div class="bars" aria-hidden="true">
      <i class="b-known" id="bar-known"></i>
      <i class="b-red" id="bar-red"></i>
    </div>
    <span class="ptext" id="progress-text">0 / 11,000</span>
    <button class="icon-btn" id="reset" title="Clear all marks" aria-label="Clear all marks">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 6.7 9h-2.1A5 5 0 1 1 10 5c1.4 0 2.6.6 3.5 1.5L11 9h6V3l-1.9 1.9A7 7 0 0 0 10 3Z"/></svg>
    </button>
  </div>
</header>

<main id="stage">
  <canvas id="world" aria-label="Map of the 11,000 HSK 3.0 words"></canvas>

  <div class="hud legend" id="legend"></div>

  <div class="hud zoombox">
    <button class="icon-btn" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="icon-btn" data-zoom="out" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="icon-btn wide" data-zoom="fit" title="Show the whole map" aria-label="Show the whole map">Fit</button>
  </div>

  <div class="minimap" id="minimap" title="Overview — click to jump">
    <div class="mm-world" id="mm-world"></div>
    <div class="mm-view" id="mm-view"></div>
  </div>

  <div class="hint" id="hint">
    <b>Drag</b> to explore · <b>scroll</b> to zoom · <b>click</b> a card to open it · turn on <b>Quick mark</b> to tick cards in one click
  </div>

  <div class="focus" id="focus" hidden>
    <div class="focus-backdrop" data-close></div>
    <div class="focus-card" role="dialog" aria-modal="true" aria-labelledby="focus-hz" tabindex="-1">
      <button class="focus-close" data-close title="Close (Esc)" aria-label="Close">×</button>
      <div class="focus-level" id="focus-level"><span class="dot"></span><span id="focus-level-text"></span></div>
      <div class="focus-hz" id="focus-hz"></div>
      <div class="focus-py" id="focus-py"></div>
      <div class="focus-def" id="focus-def"></div>
      <div class="focus-actions">
        <button data-mark="1" class="mk mk-known">Known</button>
        <button data-mark="2" class="mk mk-review">To review</button>
      </div>
      <div class="focus-pos" id="focus-pos"></div>
    </div>
  </div>

  <div class="loader" id="loader"><span></span>Preparing the map…</div>
</main>

<script src="data.js"></script>
<script src="defs.js"></script>
<script src="app.js"></script>
</body>
</html>
